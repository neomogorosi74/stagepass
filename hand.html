<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>showing up is showing love</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0d0a12;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
  }
  #password-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #0d0a12;
    z-index: 100;
    transition: opacity 0.8s ease;
  }
  #password-screen.hidden { opacity: 0; pointer-events: none; }
  #password-screen h2 {
    color: #b89470;
    font-weight: normal;
    margin-bottom: 24px;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  #password-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid #b89470;
    color: #b89470;
    font-size: 18px;
    padding: 10px 14px;
    outline: none;
    text-align: center;
    font-family: 'Georgia', serif;
    width: 240px;
    letter-spacing: 2px;
  }
  #password-input::placeholder { color: #3a2a1a; letter-spacing: 1px; }
  #submit-btn {
    margin-top: 24px;
    background: transparent;
    border: 1px solid #b89470;
    color: #b89470;
    padding: 8px 36px;
    cursor: pointer;
    font-family: 'Georgia', serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: 0.3s;
  }
  #submit-btn:hover { background: #b89470; color: #0d0a12; }
  #error-msg {
    color: #c44;
    margin-top: 14px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    position: absolute;
    bottom: 32%;
  }
  svg {
    max-width: 100vw;
    max-height: 100vh;
    display: block;
  }
</style>
</head>
<body>

<div id="password-screen">
  <h2>Enter Password</h2>
  <input type="password" id="password-input" placeholder="password" autofocus />
  <button id="submit-btn">Enter</button>
  <p id="error-msg">Incorrect password</p>
</div>

<div id="content" style="display:none">

    <stop offset="100%" stop-color="#08060c" />
  </radialGradient>

  <radialGradient id="skinGrad" cx="45%" cy="30%" r="65%">

    <stop offset="50%" stop-color="#cfa888" />
    <stop offset="80%" stop-color="#b8906e" />
    <stop offset="100%" stop-color="#9a7052" />
  </radialGradient>

  <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7a5a3e" stop-opacity="0.3"/>
    <stop offset="30%" stop-color="#7a5a3e" stop-opacity="0.8"/>
    <stop offset="70%" stop-color="#7a5a3e" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#7a5a3e" stop-opacity="0.3"/>
  </linearGradient>

  <filter id="threeD" x="-5%" y="-5%" width="110%" height="110%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="4.5" specularConstant="0.65" specularExponent="28" result="spec">
      <fePointLight x="220" y="200" z="180"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.35" k4="0"/>
  </filter>

  <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
    <feOffset dx="8" dy="16" result="offsetBlur"/>
    <feComponentTransfer in="offsetBlur"><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
    <feMerge>
      <feMergeNode/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="glow">
    <feGaussianBlur stdDeviation="40"/>
  </filter>
</defs>

</div>

<script>
  const correctPassword = "foampaperplates";
  const pwdScreen = document.getElementById('password-screen');
  const pwdInput = document.getElementById('password-input');
  const submitBtn = document.getElementById('submit-btn');
  const content = document.getElementById('content');
  const errorMsg = document.getElementById('error-msg');

  function checkPassword() {
    if (pwdInput.value === correctPassword) {
      pwdScreen.classList.add('hidden');
      content.style.display = 'flex';
      setTimeout(() => { pwdScreen.style.display = 'none'; }, 800);
    } else {
      errorMsg.style.opacity = '1';
      setTimeout(() => { errorMsg.style.opacity = '0'; }, 3000);
    }
  }

  submitBtn.addEventListener('click', checkPassword);
  pwdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkPassword(); });
  pwdInput.focus();
</script>

</body>
</html>
